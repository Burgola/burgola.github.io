<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Text in this file is replaced from js/i18n on load; the English here
       only shows before the scripts run. -->
  <title>Burgola Prekmurje Map</title>
  <meta name="description" content="Interactive map of Prekmurje">
  <link rel="icon" href="favicon.svg?v=20261005161729" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css?v=20261005161729">
  <!-- The map style (CONFIG.mapStyle in js/config.js — keep the two the same)
       starts loading with the page instead of after all the scripts. -->
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="preload" href="https://tiles.openfreemap.org/styles/liberty" as="fetch" crossorigin>
  <link rel="modulepreload" href="js/config.js?v=20261005161729">
  <link rel="modulepreload" href="js/core/data.js?v=20261005161729">
  <link rel="modulepreload" href="js/core/storage.js?v=20261005161729">
  <link rel="modulepreload" href="js/i18n/en.js?v=20261005161729">
  <link rel="modulepreload" href="js/i18n/i18n.js?v=20261005161729">
  <link rel="modulepreload" href="js/i18n/sl.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/aerial.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/basemap-control.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/basemap.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/boundaries.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/geo.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/houses.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/map.js?v=20261005161729">

  <link rel="modulepreload" href="js/map/places.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/region-lock.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/search.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/selection/panel.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/selection/selection.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/text-size.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/tile-cache.js?v=20261005161729">
  <link rel="modulepreload" href="js/map/view-control.js?v=20261005161729">

  <link rel="modulepreload" href="js/ui/nav.js?v=20261005161729">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#map" data-view="map">
      <img src="favicon.svg?v=20261005161729" alt="" width="28" height="28">
      <span data-i18n="site.brand">Burgola Prekmurje Map</span>
    </a>

    <nav id="nav" class="nav">
      <a href="#map" data-view="map" data-i18n="nav.map">Map</a>
      <a href="#about" data-view="about" data-i18n="nav.about">About</a>
    </nav>

    <div id="language-switch" class="language-switch" role="group" data-i18n-attr="aria-label:nav.language"></div>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav" data-i18n-attr="aria-label:nav.openMenu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main>
    <section id="view-map" class="view view-map" data-view-panel="map">
      <div id="map" class="map"></div>

      <div id="map-message" class="map-message" hidden>
        <strong data-i18n="map.error.title"></strong><br>
        <span data-i18n="map.error.body"></span>
      </div>

      <aside id="selection-panel" class="selection-panel" hidden aria-live="polite">
        <button class="sp-close" type="button" data-i18n-attr="aria-label:selection.close;title:selection.close">&times;</button>
        <div class="sp-kind"></div>
        <h2 class="sp-name"></h2>
        <div class="sp-subtitles"></div>
        <div class="sp-note" hidden></div>
        <div class="sp-body"></div>
        <div class="sp-actions">
          <button class="sp-zoom" type="button" data-i18n="selection.zoomTo"></button>
        </div>
      </aside>
    </section>

    <section id="view-about" class="view view-page" data-view-panel="about" hidden>
      <article class="page">
        <h1 data-i18n="about.title"></h1>
        <p data-i18n="about.body"></p>
        <p class="credits">
          <span data-i18n="credits.site"></span>:
          <a href="https://vladimirjanus.github.io" target="_blank" rel="noopener">Vladimir Januš</a><br>
          <span data-i18n="credits.mapping"></span>: <strong>Tim Bunderla</strong>
        </p>
      </article>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.js"></script>
  <script type="module" src="js/main.js?v=20261005161729"></script>
</body>
</html>
